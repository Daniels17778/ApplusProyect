{% load static %}
<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Iniciar sesión | Applus+</title>
    <link rel="stylesheet" href="{% static 'css/style2.css' %}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-wrap {
            width: 100%;
            max-width: 360px;
            padding: 16px;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 18px;
        }

        .login-brand b {
            font-size: 32px;
            color: var(--g);
            letter-spacing: -2px;
        }

        .login-brand b:first-letter {
            color: var(--o);
        }

        .login-brand small {
            display: block;
            color: #888;
            font-size: 10px;
            letter-spacing: .5px;
            margin-top: 6px;
        }

        .login-card {
            padding: 24px;
        }

        .login-card h1 {
            font-size: 18px;
            margin: 0 0 4px;
        }

        .login-card .sub {
            margin-bottom: 18px;
        }

        .login-field {
            margin-bottom: 14px;
        }

        .login-field label {
            display: block;
            font-size: 11px;
            color: #777;
            margin-bottom: 4px;
        }

        .login-field input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 10px 11px;
            font-size: 13px;
        }

        .login-error {
            background: #fdeceb;
            color: var(--red);
            border: 1px solid #f3c6c2;
            border-radius: 6px;
            padding: 9px 11px;
            font-size: 12px;
            margin-bottom: 14px;
        }

        .login-submit {
            width: 100%;
            margin-top: 4px;
            padding: 10px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="login-wrap">
        <div class="login-brand">
            <b>Applus<span class="plus">+</span></b>
            <small>CONTROL DE ANTICIPOS Y LEGALIZACIONES</small>
        </div>

        <div class="card login-card">
            <h1>Iniciar sesión</h1>
            <div class="sub">Ingresa con tu usuario y contraseña.</div>

            {% if error %}
            <div class="login-error">{{ error }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="login-field">
                    <label>Usuario</label>
                    <input type="text" name="username" autofocus required>
                </div>
                <div class="login-field">
                    <label>Contraseña</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn primary login-submit">Ingresar</button>
            </form>
        </div>
    </div>
</body>

</html>
